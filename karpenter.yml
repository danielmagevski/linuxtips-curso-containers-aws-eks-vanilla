apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: linuxtips
spec:
  instanceProfile: "linuxtips-eks-cluster"
  amiFamily: "AL2023"
  amiSelectorTerms:
    - id: ami-0cd1ba68c12d7cba8
  securityGroupSelectorTerms:
    - id: sg-000cb9cb1daae1604
  subnetSelectorTerms:
    - id: subnet-08cc52e9cb92bc741
    - id: subnet-0ae02a7cbd5a1adde
    - id: subnet-06281b0e3e50671ec
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: linuxtips
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        workload: "etc"
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - t3
            - t3a

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - small
            - large
            - xlarge

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - "spot"

        - key: "topology.kubernetes.io/zone"
          operator: In
          values:
            - "us-east-1a"
            - "us-east-1b"
            - "us-east-1c"

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: linuxtips
