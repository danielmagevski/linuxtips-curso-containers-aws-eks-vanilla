apiVersion: karpenter.k8s.aws/v1
kind: EC2NodeClass
metadata:
  name: linuxtips
spec:
  instanceProfile: "linuxtips-cluster"
  amiFamily: "AL2023"
  amiSelectorTerms:
    - id: ami-0cd1ba68c12d7cba8
  securityGroupSelectorTerms:
    - id: sg-057fb594bfdf399cc
  subnetSelectorTerms:
    - id: subnet-02aa1ab3c8802843c
    - id: subnet-06827f9b4197896fd
    - id: subnet-0682fbcafab88b1be
---
apiVersion: karpenter.sh/v1
kind: NodePool
metadata:
  name: linuxtips
spec:
  disruption:
    consolidationPolicy: WhenEmptyOrUnderutilized
    consolidateAfter: 1m
  template:
    metadata:
      labels:
        workload: "etc"
    spec:
      requirements:
        - key: karpenter.k8s.aws/instance-family
          operator: In
          values:
            - t3
            - t3a

        - key: karpenter.k8s.aws/instance-size
          operator: In
          values:
            - large
            - medium

        - key: karpenter.sh/capacity-type
          operator: In
          values:
            - "spot"
            - "on-demand"

        - key: "topology.kubernetes.io/zone"
          operator: In
          values:
            - "us-east-1a"
            - "us-east-1b"
            - "us-east-1c"

      nodeClassRef:
        group: karpenter.k8s.aws
        kind: EC2NodeClass
        name: linuxtips
